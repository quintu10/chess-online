
<!-- CARGANDO DATOS DE GOOGLE -->
<div *ngIf="loading">

  <p>Cargando...</p>

</div>


<!-- REGISTRO -->
<div *ngIf="!loading">

  <div class="google-register">

    <div class="register-content">

      <h1>Chess Online</h1>

      <div class="register-card">

        <div class="register-title">
          <span class="chess-icon">♙</span>
          <span>REGISTRO CON GOOGLE</span>
        </div>


        <!-- DATOS DE GOOGLE -->
        <div class="google-user">

          <img
            *ngIf="avatar"
            [src]="avatar"
            alt="Avatar de Google"
            class="avatar"
          >

          <p class="email">
            {{ email }}
          </p>

        </div>


        <!-- USERNAME -->
        <label for="username">
          Nombre de usuario
        </label>

        <input
          id="username"
          type="text"
          [(ngModel)]="username"
          placeholder="Elegí tu nombre de usuario"
          autocomplete="off"
        >


        <!-- PASSWORD -->
        <label for="password">
          Contraseña
        </label>

        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          placeholder="Elegí una contraseña"
          autocomplete="off"
        >


        <!-- CONFIRM PASSWORD -->
        <label for="confirmPassword">
          Confirmar contraseña
        </label>

        <input
          id="confirmPassword"
          type="password"
          [(ngModel)]="confirmPassword"
          placeholder="Confirmá tu contraseña"
          autocomplete="off"
        >


        <!-- ERROR -->
        <p
          class="error-message"
          *ngIf="errorMessage"
        >
          {{ errorMessage }}
        </p>


        <!-- BOTÓN -->
        <button
          class="register-button"
          type="button"
          [disabled]="
            !username.trim() ||
            !password.trim() ||
            !confirmPassword.trim()
          "
          (click)="completeRegistration()"
        >
          Crear cuenta
        </button>

      </div>

    </div>

  </div>

</div>
