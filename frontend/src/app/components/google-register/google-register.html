<div *ngIf="loading">

  <p>Cargando...</p>

</div>

<div *ngIf="!loading">

  <div class="google-register">

    <h1>Registro con Google</h1>

    <img
      *ngIf="avatar"
      class="avatar"
      [src]="avatar"
      alt="Avatar de Google"
    />

    <p class="email">{{ email }}</p>

    <label for="username">
      Nombre de usuario
    </label>

    <input
      id="username"
      type="text"
      [(ngModel)]="username"
      placeholder="Elegí tu nombre de usuario"
    />

    <label for="password">
      Contraseña
    </label>

    <input
      id="password"
      type="password"
      [(ngModel)]="password"
      placeholder="Elegí una contraseña"
    />

    <label for="confirmPassword">
      Confirmar contraseña
    </label>

    <input
      id="confirmPassword"
      type="password"
      [(ngModel)]="confirmPassword"
      placeholder="Confirmá tu contraseña"
    />

    <button
      type="button"
      (click)="completeRegistration()"
    >
      Crear cuenta
    </button>

  </div>

</div>
