<div *ngIf="loading">

  <p>Cargando...</p>

</div>

<div *ngIf="!loading" class="main-menu">

  <h1 (click)="openHome()">Chess Online</h1>

  <div class="menu-content">

    <div class="menu-card">

      <div class="menu-title">
        <span class="chess-icon">♟</span>
        <span>JUGAR</span>
      </div>

      <button class="menu-button online-button"(click)="openHome()">
        <span class="button-icon">👥</span>
        <span class="button-text">
          <strong>Jugar en línea</strong>
          <small>Juega contra otros jugadores</small>
        </span>
      </button>

      <button class="menu-button local-button" (click)="openLocalGame()">
        <span class="button-icon">♟</span>
        <span class="button-text">
          <strong>Jugar local</strong>
          <small>Juega en este dispositivo</small>
        </span>
      </button>

      <div class="menu-divider">
        <span>o</span>
      </div>

      <button *ngIf="!user" class="account-button" (click)="openLogin()">
        <span class="account-icon">♙</span>
        <span>Iniciar sesión</span>
      </button>

      <button *ngIf="!user" class="account-button register-button" (click)="openRegister()">
        <span class="account-icon">+</span>
        <span>Registrarse</span>
      </button>

      <div class="account-user" *ngIf="user">

        <div class="user-avatar">
          <img
            [src]="user.avatar"
            alt="Avatar"
          >
          

          <span *ngIf="!user.avatar">♙</span>
        </div>

        <div class="user-info">
          <small>Sesión iniciada como</small>
          <strong>{{ user.username }}</strong>
        </div>

      </div>

      <button
        class="account-button logout-button"
        (click)="logout()"
        *ngIf="user"
      >
        <span class="account-icon">↪</span>
        <span>Cerrar sesión</span>
      </button>

    </div>

  </div>

</div>

<!-- Modal juego local -->
<div class="modal-overlay" *ngIf="showLocalGameModal">

  <div class="local-game-modal">

    <div class="modal-header">
      <span class="modal-icon">♟</span>
      <h2>JUEGO LOCAL</h2>
    </div>

    <div class="modal-content">

      <label for="playerName">
        Ingresá tu nombre
      </label>

      <input
        id="playerName"
        type="text"
        [(ngModel)]="playerName"
        placeholder="Tu nombre"
        maxlength="20"
        autocomplete="off"
        (keyup.enter)="startLocalGame()"
      >

    </div>

    <div class="modal-actions">

      <button
        class="modal-button cancel-button"
        (click)="cancelLocalGame()"
      >
        Cancelar
      </button>

      <button
        class="modal-button accept-button"
        [disabled]="!playerName.trim()"
        (click)="startLocalGame()"
      >
        Aceptar
      </button>

    </div>

  </div>

</div>
